<title>Comptoir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: admin shell (dark pine sidebar + working canvas); the storefront swaps in full-width with a cart drawer */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --sunk:#E3EAE5; --ink:#15201B; --muted:#5A6A62; --line:#D3DCD6;
  --accent:#1F6F5C; --accent-ink:#FFFFFF; --accent-soft:#D5E9E1;
  --side:#13221C; --side-ink:#B9CCC2; --side-hi:#FFFFFF; --side-active:#22392F;
  --ok:#2C7A4C; --ok-soft:#DBEFE2; --warn:#8F5B00; --warn-soft:#FAEAC6; --bad:#B13838; --bad-soft:#F6DADA; --info:#2A5BA6; --info-soft:#DBE6F6;
  --scrim:rgba(14,22,18,.45);
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1B; --sunk:#1D2823; --ink:#E2EBE6; --muted:#91A399; --line:#2A3832;
  --accent:#55B999; --accent-ink:#0A1D16; --accent-soft:#1B3A2F;
  --side:#09100D; --side-ink:#A3B6AB; --side-hi:#FFFFFF; --side-active:#1A2B24;
  --ok:#62C68E; --ok-soft:#173424; --warn:#E3AA4C; --warn-soft:#382A0F; --bad:#EA7E7E; --bad-soft:#3B1B1B; --info:#86ADEA; --info-soft:#18273D;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1B; --sunk:#1D2823; --ink:#E2EBE6; --muted:#91A399; --line:#2A3832;
  --accent:#55B999; --accent-ink:#0A1D16; --accent-soft:#1B3A2F;
  --side:#09100D; --side-ink:#A3B6AB; --side-hi:#FFFFFF; --side-active:#1A2B24;
  --ok:#62C68E; --ok-soft:#173424; --warn:#E3AA4C; --warn-soft:#382A0F; --bad:#EA7E7E; --bad-soft:#3B1B1B; --info:#86ADEA; --info-soft:#18273D;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem} h2{font-size:1.15rem} h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* shell */
#app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
#app.shop{grid-template-columns:1fr}
#side{background:var(--side);color:var(--side-ink);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
#app.shop #side{display:none}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;color:var(--side-hi)}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.brand b{font-family:var(--f-display);font-size:1.05rem;display:block;line-height:1.1}
.brand small{font-size:.75rem;opacity:.7}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:none;color:inherit;text-align:left;cursor:pointer;width:100%}
.nav:hover{background:var(--side-active);color:var(--side-hi)}
.nav[aria-current="page"]{background:var(--side-active);color:var(--side-hi);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;font-family:var(--f-mono);font-size:.75rem;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 7px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.nav.store{border:1px solid var(--side-active)}
#main{min-width:0;padding-inline:clamp(16px,3vw,40px);padding-block:28px 64px}
#app.shop #main{padding:0}
.page{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head p{margin:4px 0 0}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px}
.card-b{padding:16px 18px}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .d{font-size:.8rem;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 18px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
td.r,th.r{text-align:right}
.cell-prod{display:flex;align-items:center;gap:12px;min-width:200px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.neutral{background:var(--sunk);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-family:var(--f-mono);font-size:.75rem;opacity:.7;margin-left:4px}

/* swatches (product visual) */
.sw{--h:160;border-radius:8px;display:grid;place-items:center;flex:none;font-family:var(--f-display);font-weight:700;
  background:linear-gradient(140deg,hsl(var(--h) 42% 80%),hsl(calc(var(--h) + 30) 44% 58%));color:hsl(var(--h) 50% 18%);position:relative;overflow:hidden}
.sw::after{content:"";position:absolute;inset:auto -20% -40% 30%;height:70%;border-radius:50%;background:hsl(var(--h) 60% 95% / .35)}
.sw span{position:relative;z-index:1}
.sw-s{width:40px;height:40px;font-size:.85rem}
.sw-m{width:64px;height:64px;font-size:1.2rem}
.sw-l{width:100%;aspect-ratio:4/3;max-width:100%;font-size:2.6rem;border-radius:12px}

/* forms */
.form{display:flex;flex-direction:column;gap:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:600;min-width:0}
label.f span.h{font-weight:400;color:var(--muted);font-size:.8rem}
input[type=text],input[type=email],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;font-weight:400}
textarea{min-height:90px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
.search{position:relative;flex:1;min-width:180px;max-width:340px}
.search input{padding-left:34px}
.search svg{position:absolute;left:10px;top:50%;translate:0 -50%;width:16px;height:16px;color:var(--muted)}

/* panel */
#panel-wrap{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end}
#panel-wrap .scrim{position:absolute;inset:0;background:var(--scrim)}
#panel{position:relative;width:min(480px,100%);height:100%;background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column;animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.6}}
@media (prefers-reduced-motion:reduce){#panel{animation:none}}
.p-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;padding-top:calc(16px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.p-body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:18px}
.p-foot{padding:14px 20px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.lines{display:flex;flex-direction:column;gap:10px}
.line{display:flex;align-items:center;gap:12px}
.line .t{flex:1;min-width:0}
.line .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.qty button{border:0;background:none;width:30px;height:30px;cursor:pointer;font-size:1rem}
.qty span{min-width:22px;text-align:center;font-family:var(--f-mono)}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:.92rem}
.sum .tot{font-weight:700;font-size:1.05rem;padding-top:8px;border-top:1px solid var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* empty + banners */
.empty{padding:40px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty p{max-width:42ch;margin:0;color:var(--muted)}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:.88rem}
.list{display:flex;flex-direction:column}
.list .li{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line)}
.list .li:last-child{border-bottom:0}
.list .li .t{flex:1;min-width:0}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .area{fill:var(--accent-soft)}
.chart .stroke{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:3}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}

/* storefront */
.shop-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.shop-top-in{max-width:1180px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:14px}
.shop-name{font-family:var(--f-display);font-size:1.35rem;font-weight:700;margin-right:auto}
.cart-btn{position:relative}
.cart-btn .badge{position:absolute;top:-6px;right:-6px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-size:.7rem;border-radius:99px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 5px}
.admin-strip{background:var(--side);color:var(--side-ink);font-size:.82rem}
.admin-strip div{max-width:1180px;margin:0 auto;padding:6px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.admin-strip button{background:none;border:1px solid var(--side-active);color:var(--side-hi);border-radius:6px;padding:3px 10px;cursor:pointer}
.hero{max-width:1180px;margin:0 auto;padding:44px 16px 18px;display:flex;flex-direction:column;gap:10px}
.hero h1{font-size:clamp(2rem,5vw,3.3rem);max-width:18ch}
.hero p{margin:0;max-width:56ch;color:var(--muted);font-size:1.05rem}
.shop-body{max-width:1180px;margin:0 auto;padding:12px 16px 72px;display:flex;flex-direction:column;gap:18px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}
.pcard{display:flex;flex-direction:column;gap:10px;cursor:pointer;border:0;background:none;padding:0;text-align:left}
.pcard:hover .sw-l{transform:translateY(-2px)}
.pcard .sw-l{transition:transform .2s}
.pcard b{font-weight:600}
.price{display:flex;gap:8px;align-items:baseline}
.price s{color:var(--muted);font-size:.85rem}
.ship-note{font-size:.85rem;color:var(--muted)}
.progress{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:30px 10px}
.done .ck{width:56px;height:56px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));translate:-50% 0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-size:.9rem;font-weight:500;max-width:calc(100% - 32px)}

@media (max-width:900px){.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){
  #app{grid-template-columns:1fr}
  #side{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:auto;flex-direction:row;overflow-x:auto;padding:8px 12px;gap:2px}
  .brand{padding:0 8px 0 0}.brand div{display:none}
  .nav{width:auto;white-space:nowrap;padding:8px 10px}
  .nav .lbl{display:none}
  .side-foot{margin:0;flex-direction:row}
  .row{grid-template-columns:1fr}
  #main{padding-block:20px 56px}
  .hide-sm{display:none}
}
</style>

<div id="app">
  <aside id="side" aria-label="Navigation"></aside>
  <main id="main"></main>
</div>
<div id="panel-wrap" hidden><div class="scrim" data-act="close"></div><section id="panel" role="dialog" aria-modal="true"></section></div>
<div id="toast" role="status" hidden></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sum = a => a.reduce((x, y) => x + (Number(y) || 0), 0);
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };

const S = {
  products: [], orders: [], settings: { name: 'Ma boutique', tagline: 'Des objets choisis avec soin, expédiés depuis notre atelier.', currency: 'EUR', shipping: 4.9, freeFrom: 60 },
  mode: 'admin', view: 'home', canAdmin: true, ready: false, local: false,
  cart: {}, panel: null, orderFilter: 'all', search: '', shopCat: 'all', settingsDirty: false
};
try { const c = JSON.parse(localStorage.getItem('comptoir-cart') || '{}'); if (c && typeof c === 'object') S.cart = c; } catch (e) {}
const saveCart = () => { try { localStorage.setItem('comptoir-cart', JSON.stringify(S.cart)); } catch (e) {} };

const STATUS = {
  pending:   { label: 'En attente', cls: 'warn' },
  paid:      { label: 'Payée',      cls: 'info' },
  shipped:   { label: 'Expédiée',   cls: 'ok' },
  cancelled: { label: 'Annulée',    cls: 'bad' }
};
const money = n => { try { return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: S.settings.currency || 'EUR' }).format(n || 0); } catch (e) { return (n || 0).toFixed(2) + ' ' + esc(S.settings.currency); } };
const dateFmt = t => new Date(t).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
const timeFmt = t => new Date(t).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const pill = st => { const s = STATUS[st] || { label: st, cls: 'neutral' }; return `<span class="pill ${s.cls}">${esc(s.label)}</span>`; };
const swatch = (p, size) => {
  const ini = String(p.name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
  return `<div class="sw sw-${size}" style="--h:${Number(p.hue) || 0}" aria-hidden="true"><span>${esc(ini)}</span></div>`;
};
const I = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  orders: '<path d="M6 3h12l1 4H5zM5 7h14v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1zM9 11h6"/>',
  products: '<path d="M20 7l-8-4-8 4 8 4zM4 7v10l8 4 8-4V7M12 11v10"/>',
  customers: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a5 5 0 0 1 3.5 6"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9 4.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 9h0a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 2z"/>',
  store: '<path d="M4 9l1.5-5h13L20 9M4 9h16v2a3 3 0 0 1-5.3 2 3 3 0 0 1-5.4 0A3 3 0 0 1 4 11zM5 13.5V20h14v-6.5M10 20v-4h4v4"/>',
  cart: '<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.6 12.4a1 1 0 0 0 1 .8h9.3a1 1 0 0 0 1-.8L21 7H6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>', search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>', back: '<path d="M15 5l-7 7 7 7"/>'
};
const icon = (n, s = 18) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

/* ---------- store layer: shared db when the viewer serves it, otherwise this tab only ---------- */
let DB = null;
const upsert = (arr, o) => { const i = arr.findIndex(x => x.id === o.id); if (i >= 0) arr[i] = o; else arr.unshift(o); };
const store = {
  async saveProduct(p) { if (DB) await DB.collection('products').doc(p.id).set(p); else { upsert(S.products, p); render(); } },
  async deleteProduct(id) { if (DB) await DB.collection('products').doc(id).delete(); else { S.products = S.products.filter(x => x.id !== id); render(); } },
  async saveOrder(o) { if (DB) await DB.collection('orders').doc(o.id).set(o); else { upsert(S.orders, o); S.orders.sort((a, b) => b.createdAt - a.createdAt); render(); } },
  async saveSettings(s) { if (DB) await DB.doc('settings/store').set(s); else { S.settings = s; render(); } }
};
const errMsg = e => e && e.code === 'invalid_argument' ? "Vous n'avez pas le droit de modifier cette boutique." : e && e.code === 'quota_exceeded' ? 'La boutique a atteint sa limite de stockage.' : "L'enregistrement a échoué. Réessayez dans un instant.";

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }

/* ---------- derived ---------- */
const activeProducts = () => S.products.filter(p => p.status === 'active');
const cartLines = () => Object.entries(S.cart).map(([id, q]) => ({ p: S.products.find(x => x.id === id), q })).filter(l => l.p && l.q > 0);
const cartCount = () => sum(cartLines().map(l => l.q));
const totals = () => {
  const sub = sum(cartLines().map(l => l.p.price * l.q));
  const ship = sub === 0 || sub >= num(S.settings.freeFrom) ? 0 : num(S.settings.shipping);
  return { sub, ship, total: sub + ship };
};
const customers = () => {
  const m = new Map();
  for (const o of S.orders) {
    const k = String(o.customer?.email || o.customer?.name || '?').toLowerCase();
    const c = m.get(k) || { name: o.customer?.name, email: o.customer?.email, city: o.customer?.city, orders: 0, spent: 0, last: 0 };
    c.orders++; if (o.status !== 'cancelled') c.spent += o.total || 0; if (o.createdAt > c.last) c.last = o.createdAt;
    m.set(k, c);
  }
  return [...m.values()].sort((a, b) => b.spent - a.spent);
};

function chartData() {
  const days = []; const d0 = new Date(); d0.setHours(0, 0, 0, 0);
  for (let i = 13; i >= 0; i--) { const d = new Date(d0); d.setDate(d.getDate() - i); days.push({ t: d.getTime(), v: 0 }); }
  for (const o of S.orders) {
    if (o.status === 'cancelled') continue;
    const d = new Date(o.createdAt); d.setHours(0, 0, 0, 0);
    const day = days.find(x => x.t === d.getTime()); if (day) day.v += o.total || 0;
  }
  return days;
}
function chart() {
  const data = chartData(); const W = 600, H = 190, L = 44, R = 12, T = 14, B = 26;
  const raw = Math.max(...data.map(d => d.v), 1);
  const step = [10, 20, 50, 100, 200, 250, 500, 1000, 2000, 5000, 10000].find(s => s * 4 >= raw) || Math.ceil(raw / 4);
  const max = step * 4;
  const x = i => L + i * (W - L - R) / (data.length - 1), y = v => T + (H - T - B) * (1 - v / max);
  const pts = data.map((d, i) => `${x(i).toFixed(1)},${y(d.v).toFixed(1)}`);
  const grid = [0, 1, 2, 3, 4].map(k => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(k * step)}" y2="${y(k * step)}"/><text x="${L - 8}" y="${y(k * step) + 4}" text-anchor="end">${k * step}</text>`).join('');
  const labels = data.map((d, i) => i % 3 === 1 || i === data.length - 1 ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${i === data.length - 1 ? "auj." : dateFmt(d.t)}</text>` : '').join('');
  const last = data.length - 1;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventes par jour sur 14 jours">${grid}
    <path class="area" d="M${x(0)},${y(0)} L${pts.join(' L')} L${x(last)},${y(0)} Z"/>
    <polyline class="stroke" points="${pts.join(' ')}"/>
    <circle class="dot" cx="${x(last)}" cy="${y(data[last].v)}" r="5"/>${labels}</svg>`;
}

function panelProductView(P) {
  const p = S.products.find(x => x.id === P.id); if (!p) return head('Produit') + '<div class="p-body"><p class="muted">Ce produit n\'est plus disponible.</p></div>';
  const inCart = S.cart[p.id] || 0; const max = Math.max(0, p.stock - inCart); const q = Math.min(P.qty || 1, Math.max(max, 1));
  return `${head(esc(p.category || S.settings.name))}
  <div class="p-body">${swatch(p, 'l')}
    <div style="display:flex;flex-direction:column;gap:6px"><h1 style="font-size:1.6rem">${esc(p.name)}</h1><div class="price" style="font-size:1.15rem"><span class="num">${money(p.price)}</span>${p.compareAt > p.price ? `<s class="num">${money(p.compareAt)}</s>` : ''}</div></div>
    ${p.description ? `<p style="margin:0;white-space:pre-line">${esc(p.description)}</p>` : ''}
    <span class="muted" style="font-size:.88rem">${p.stock <= 0 ? 'Épuisé pour le moment.' : `${p.stock} en stock${inCart ? `, dont ${inCart} dans votre panier` : ''}.`}</span>
  </div>
  <div class="p-foot"><div class="qty"><button data-act="vq" data-d="-1" aria-label="Moins">−</button><span>${q}</span><button data-act="vq" data-d="1" aria-label="Plus">+</button></div>
    <button class="btn primary" style="flex:1" data-act="add-cart" ${max <= 0 ? 'disabled' : ''}>${max <= 0 ? (p.stock <= 0 ? 'Épuisé' : 'Tout le stock est dans votre panier') : `Ajouter au panier · ${money(p.price * q)}`}</button></div>`;
}

function shipNote(t) {
  const free = num(S.settings.freeFrom);
  if (t.sub === 0 || free <= 0) return '';
  if (t.ship === 0) return `<div class="ship-note">La livraison est offerte.</div>`;
  return `<div style="display:flex;flex-direction:column;gap:6px"><div class="ship-note">Plus que <b class="num">${money(free - t.sub)}</b> pour la livraison offerte.</div><div class="progress"><i style="width:${Math.min(100, t.sub / free * 100)}%"></i></div></div>`;
}
function panelCart() {
  const lines = cartLines(); const t = totals();
  if (!lines.length) return `${head('Panier')}<div class="p-body"><div class="empty"><p>Votre panier est vide.</p><button class="btn" data-act="close">Continuer mes achats</button></div></div>`;
  return `${head('Panier')}<div class="p-body">${shipNote(t)}
    <div class="lines">${lines.map(l => `<div class="line">${swatch(l.p, 's')}<div class="t"><b>${esc(l.p.name)}</b><span class="muted num">${money(l.p.price)}</span></div>
      <div class="qty"><button data-act="cq" data-id="${esc(l.p.id)}" data-d="-1" aria-label="Moins">−</button><span>${l.q}</span><button data-act="cq" data-id="${esc(l.p.id)}" data-d="1" aria-label="Plus" ${l.q >= l.p.stock ? 'disabled' : ''}>+</button></div></div>`).join('')}</div>
    <div class="sum"><span class="muted">Sous-total</span><span class="num">${money(t.sub)}</span><span class="muted">Livraison</span><span class="num">${t.ship ? money(t.ship) : 'Offerte'}</span><span class="tot">Total</span><span class="tot num">${money(t.total)}</span></div>
  </div><div class="p-foot"><button class="btn primary" style="flex:1" data-act="checkout">Passer la commande</button></div>`;
}
function panelCheckout(P) {
  const t = totals(); const d = P.draft || {};
  return `<form id="checkout-form" style="display:contents">${head('Livraison', 'open-cart')}
  <div class="p-body"><div class="form">
    <label class="f">Nom complet<input id="co-name" type="text" name="name" required maxlength="80" autocomplete="name" value="${esc(d.name)}"></label>
    <label class="f">E-mail<span class="h">Pour la confirmation de commande.</span><input id="co-email" type="email" name="email" required maxlength="120" autocomplete="email" value="${esc(d.email)}"></label>
    <label class="f">Adresse<input id="co-address" type="text" name="address" required maxlength="140" autocomplete="street-address" value="${esc(d.address)}"></label>
    <div class="row"><label class="f">Code postal<input id="co-zip" type="text" name="zip" required maxlength="12" autocomplete="postal-code" value="${esc(d.zip)}"></label>
      <label class="f">Ville<input id="co-city" type="text" name="city" required maxlength="60" autocomplete="address-level2" value="${esc(d.city)}"></label></div>
    <label class="f">Note pour la boutique<span class="h">Optionnel.</span><textarea id="co-note" name="note" maxlength="300" style="min-height:60px">${esc(d.note)}</textarea></label>
    <div class="card card-b"><b>Paiement à la livraison</b><div class="muted" style="font-size:.88rem">Aucun paiement n'est demandé en ligne : vous réglez à la réception du colis.</div></div>
    <div class="sum"><span class="muted">${cartCount()} article${cartCount() > 1 ? 's' : ''}</span><span class="num">${money(t.sub)}</span><span class="muted">Livraison</span><span class="num">${t.ship ? money(t.ship) : 'Offerte'}</span><span class="tot">Total</span><span class="tot num">${money(t.total)}</span></div>
  </div></div>
  <div class="p-foot"><button type="submit" class="btn primary" style="flex:1" ${P.busy ? 'disabled' : ''}>${P.busy ? 'Envoi…' : `Valider la commande · ${money(t.total)}`}</button></div></form>`;
}
function panelDone(P) {
  return `${head('Commande confirmée')}<div class="p-body"><div class="done"><div class="ck">${icon('check', 28)}</div><h1 style="font-size:1.5rem">Merci ${esc(P.name)} !</h1>
    <p class="muted" style="margin:0">Votre commande <b class="mono">#${esc(P.number)}</b> est enregistrée. ${esc(S.settings.name)} la prépare et vous la réglerez à la livraison.</p>
    <button class="btn primary" data-act="close">Continuer mes achats</button></div></div>`;
}

/* ---------- actions ---------- */
const blankProduct = () => ({ id: uid(), name: '', description: '', price: '', compareAt: 0, stock: 10, category: '', status: 'active', hue: Math.floor(Math.random() * 360), createdAt: Date.now() });

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, P = S.panel;
  if (a === 'close') return closePanel();
  if (a === 'nav') { S.view = el.dataset.v; S.settingsDirty = false; closePanel(); render(); window.scrollTo(0, 0); return; }
  if (a === 'mode') { S.mode = el.dataset.m; closePanel(); render(); window.scrollTo(0, 0); return; }
  if (a === 'ofilter') { S.orderFilter = el.dataset.f; return render(); }
  if (a === 'cat') { S.shopCat = el.dataset.c; return render(); }
  if (a === 'new-product') return openPanel({ type: 'product', isNew: true, draft: blankProduct() });
  if (a === 'edit-product') { const p = S.products.find(x => x.id === el.dataset.id); if (p) openPanel({ type: 'product', isNew: false, draft: { ...p } }); return; }
  if (a === 'del-product') {
    if (!P.armed) { P.armed = true; return renderPanel(); }
    try { await store.deleteProduct(P.draft.id); delete S.cart[P.draft.id]; saveCart(); closePanel(); toast('Produit supprimé'); } catch (err) { toast(errMsg(err)); }
    return;
  }
  if (a === 'open-order') return openPanel({ type: 'order', id: el.dataset.id });
  if (a === 'order-status') {
    const o = S.orders.find(x => x.id === P.id); if (!o) return;
    const st = el.dataset.st;
    try { await store.saveOrder({ ...o, status: st, updatedAt: Date.now() }); toast(`Commande #${o.number} : ${STATUS[st].label.toLowerCase()}`); renderPanel(); } catch (err) { toast(errMsg(err)); }
    return;
  }
  if (a === 'open-product') return openPanel({ type: 'view', id: el.dataset.id, qty: 1 });
  if (a === 'vq') { P.qty = Math.max(1, (P.qty || 1) + Number(el.dataset.d)); const p = S.products.find(x => x.id === P.id); if (p) P.qty = Math.min(P.qty, Math.max(1, p.stock - (S.cart[p.id] || 0))); return renderPanel(); }
  if (a === 'add-cart') { const p = S.products.find(x => x.id === P.id); if (!p) return; S.cart[p.id] = Math.min(p.stock, (S.cart[p.id] || 0) + (P.qty || 1)); saveCart(); render(); toast(`${p.name} ajouté au panier`); return openPanel({ type: 'cart' }); }
  if (a === 'open-cart') return openPanel({ type: 'cart' });
  if (a === 'cq') { const id = el.dataset.id; const p = S.products.find(x => x.id === id); S.cart[id] = Math.max(0, Math.min(p ? p.stock : 0, (S.cart[id] || 0) + Number(el.dataset.d))); if (!S.cart[id]) delete S.cart[id]; saveCart(); render(); return renderPanel(); }
  if (a === 'checkout') return openPanel({ type: 'checkout', draft: S.lastCustomer || {} });
});

document.addEventListener('input', e => {
  if (e.target.id === 'p-search') { S.search = e.target.value; const b = $('#p-rows'); if (b) b.innerHTML = productRows(); }
  if (e.target.id === 'pf-hue' && S.panel) { S.panel.draft.hue = Number(e.target.value); $('#pf-preview').innerHTML = swatch({ ...S.panel.draft, name: $('#pf-name').value }, 'm'); }
  if (e.target.id === 'pf-name' && S.panel) { $('#pf-preview').innerHTML = swatch({ ...S.panel.draft, name: e.target.value }, 'm'); }
  if (e.target.closest('#settings-form')) S.settingsDirty = true;
  if (e.target.closest('#checkout-form') && S.panel) S.panel.draft = Object.fromEntries(new FormData($('#checkout-form')));
});

document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, d = Object.fromEntries(new FormData(f));
  if (f.id === 'product-form') {
    const P = S.panel;
    const p = { ...P.draft, name: d.name.trim(), description: d.description.trim(), price: Math.round(num(d.price) * 100) / 100, compareAt: Math.round(num(d.compareAt) * 100) / 100,
      stock: Math.max(0, Math.round(num(d.stock))), category: d.category.trim(), status: d.status, hue: Number(d.hue) || 0, updatedAt: Date.now() };
    if (!p.name) return toast('Donnez un nom au produit.');
    try { await store.saveProduct(p); closePanel(); toast(P.isNew ? 'Produit ajouté' : 'Produit enregistré'); } catch (err) { toast(errMsg(err)); }
  }
  if (f.id === 'settings-form') {
    const s = { name: d.name.trim() || 'Ma boutique', tagline: d.tagline.trim(), currency: d.currency, shipping: Math.max(0, num(d.shipping)), freeFrom: Math.max(0, num(d.freeFrom)) };
    try { await store.saveSettings(s); S.settings = s; S.settingsDirty = false; render(); toast('Réglages enregistrés'); } catch (err) { toast(errMsg(err)); }
  }
  if (f.id === 'checkout-form') {
    const P = S.panel; if (P.busy) return;
    const lines = cartLines(); if (!lines.length) return openPanel({ type: 'cart' });
    const t = totals();
    const customer = { name: d.name.trim(), email: d.email.trim(), address: d.address.trim(), zip: d.zip.trim(), city: d.city.trim() };
    const number = String(1001 + Math.max(S.orders.length, ...S.orders.map(o => (Number(o.number) || 1000) - 1000)));
    const order = { id: uid(), number, createdAt: Date.now(), status: 'pending', customer, note: (d.note || '').trim(),
      items: lines.map(l => ({ id: l.p.id, name: l.p.name, price: l.p.price, qty: l.q, hue: l.p.hue })),
      subtotal: t.sub, shipping: t.ship, total: Math.round(t.total * 100) / 100 };
    P.busy = true; renderPanel();
    try {
      await store.saveOrder(order);
      for (const l of lines) { try { await store.saveProduct({ ...l.p, stock: Math.max(0, l.p.stock - l.q) }); } catch (err) {} }
      S.cart = {}; saveCart(); S.lastCustomer = customer; render();
      openPanel({ type: 'done', name: customer.name.split(' ')[0], number });
    } catch (err) { P.busy = false; renderPanel(); toast(errMsg(err)); }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.panel) closePanel(); });

/* ---------- boot ---------- */
async function boot() {
  render();
  let user = null;
  try {
    if (window.claude && window.claude.use) [DB, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  } catch (e) { DB = null; }
  if (user) { try { S.canAdmin = (await user.canEdit()) !== false; } catch (e) {} }
  if (!S.canAdmin) S.mode = 'shop';
  if (!DB) { S.local = true; S.ready = true; render(); return; }
  const onErr = () => { S.ready = true; render(); };
  DB.collection('products').onSnapshot(snap => {
    S.products = snap.docs.map(d => ({ ...d.data(), id: d.id })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    S.ready = true; render(); if (S.panel && (S.panel.type === 'view' || S.panel.type === 'cart')) renderPanel();
  }, onErr);
  DB.collection('orders').orderBy('createdAt', 'desc').limit(500).onSnapshot(snap => {
    S.orders = snap.docs.map(d => ({ ...d.data(), id: d.id })); render(); if (S.panel && S.panel.type === 'order') renderPanel();
  }, onErr);
  DB.doc('settings/store').onSnapshot(d => { if (d.exists) S.settings = { ...S.settings, ...d.data() }; render(); }, onErr);
}
boot();
})();
</script>
