# Vérifications automatiques à chaque envoi sur GitHub : typage et tests, sur SQLite et sur PostgreSQL.
name: Vérifications

on:
  push:
  pull_request:

jobs:
  sqlite:
    name: Typage et tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typage
        run: npx tsc --noEmit
      - name: Tests
        run: npm test

  postgres:
    name: Tests sur PostgreSQL (comme en production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: parnassa
          POSTGRES_PASSWORD: parnassa
          POSTGRES_DB: parnassa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parnassa" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://parnassa:parnassa@localhost:5432/parnassa_test
      TEST_DATABASE_URL: postgresql://parnassa:parnassa@localhost:5432/parnassa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests (commande, paiement, remises, remboursements sur PostgreSQL)
        run: npm test
      - name: Construction de production
        run: npm run build
