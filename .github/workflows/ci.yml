# Vérifications automatiques à chaque envoi sur GitHub : typage et tests.
name: Vérifications

on:
  push:
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Typage
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
